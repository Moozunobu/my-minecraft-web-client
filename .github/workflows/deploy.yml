name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install tsx
        run: pnpm add -g tsx

      - name: Build
        run: |
          pnpm run build
          touch dist/.nojekyll
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          PUBLIC_URL: /${{ github.event.repository.name }}/

      - name: Verify critical files exist
        run: |
          echo "Checking critical build artifacts..."
          ls -la dist/coi-serviceworker.min.js || echo "WARNING: coi-serviceworker.min.js missing!"
          ls -la dist/mesherWasm.js || echo "WARNING: mesherWasm.js missing!"
          ls -la dist/mesher.js || echo "WARNING: mesher.js missing!"
          ls -la dist/wasm_mesher_bg.wasm || echo "WARNING: wasm_mesher_bg.wasm missing!"
          echo "Checking mesherWasm.js patch..."
          grep -c 'self.location' dist/mesherWasm.js && echo "PATCH APPLIED: n1e.url fix present" || echo "WARNING: PATCH NOT APPLIED"

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages